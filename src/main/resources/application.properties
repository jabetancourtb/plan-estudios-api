spring.application.name=api-udistrital

server.port=9090

server.servlet.context-path=/api/v1

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.doc-expansion=none

spring.datasource.url=jdbc:mysql://localhost:3306/u_distrital
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/db_ecommerce
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect.format_sql=true
spring.jpa.generate-ddl=true

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
